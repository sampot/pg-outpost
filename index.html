<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a33" />
    <meta name="description" content="離島前哨 — 殖民者需求、心情與生產鏈經營" />
    <title>離島前哨</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <small>殖民地模擬</small>
          <h1>離島前哨</h1>
        </div>
        <button id="sound" type="button" aria-pressed="true">♫ 音效</button>
      </header>

      <section id="lobby" class="panel hero">
        <div class="sigil"><img src="./assets/icons/house.png" width="72" height="72" alt="" /></div>
        <p>管理五位殖民者的飽足、休息與社交。派工採集、農耕、炊事與工匠，沿生產鏈建起信標塔。</p>
        <p>最佳紀錄 <strong id="best">0</strong></p>
        <button id="start" type="button" class="primary">開始新局</button>
        <a id="credits" href="./ATTRIBUTION.md">製作與署名</a>
        <aside id="credits-panel" class="credits" hidden>
          <p>美術 Kenney Board Game Icons · 音效 Kenney Interface／RPG · BGM Blippy Bits Dew</p>
          <p>詳見 ATTRIBUTION.md</p>
        </aside>
      </section>

      <section id="game" hidden>
        <div id="hud" class="hud">
          <span id="morale">士氣 0</span>
          <span id="score">分數 0</span>
        </div>
        <div id="resources" class="resources" aria-label="資源"></div>
        <section id="board" class="board" aria-label="前哨盤面"></section>
        <p id="msg" class="msg" aria-live="polite"></p>
        <div class="controls">
          <button id="build" type="button">建造下一階</button>
          <button id="end-day" type="button" class="primary">結束這一天</button>
        </div>
        <div id="colonists" class="colonists" aria-label="殖民者"></div>
      </section>

      <p id="toast" class="toast" hidden role="status"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
